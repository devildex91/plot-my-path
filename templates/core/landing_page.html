{% load django_vite %}
{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="fantasy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plot My Path</title>
    <link rel="stylesheet" href="{% vite_asset_url 'assets/styles/style.css' %}" />
        <script>
  (function () {
    const saved = localStorage.getItem("theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute(
      "data-theme",
      saved || (prefersDark ? "sunset" : "fantasy")
    );
  })();
</script>
  </head>
  <body class="relative min-h-screen flex flex-col bg-cover bg-center bg-no-repeat" style="background-image: url('{% static 'images/landing_background.avif' %}');">
    <div class="absolute inset-0 bg-base-100/50"></div>
    <header class="relative w-full flex justify-center pt-8">
      <img src="{% static 'images/pmp-logo.png' %}" alt="Logo" class="w-50 h-auto"/>
    </header>

    <main class=" relative flex-grow items-center mt-4 text-primary">
      <h1 class="text-4xl sm:text-5xl font-bold tracking-tight  w-fit mx-auto">Plot My Path</h1>
      <p class="mt-2 justify-self-center rounded-xl w-fit mx-auto">Plan · Explore · Make it Happen</p>
    </main>

    <footer class="relative flex justify-center  p-4">
      <a href="{% url 'onboarding_page' %}" class="btn btn-primary rounded-xl w-full  sm:w-96">Your next adventure start here...</a>
    </footer>

  </body>
</html>
