{% extends 'base.html' %}
{% block content %}
  <div class="max-w-7xl mx-auto px-4 py-6 text-primary">
    <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center">Upcoming Trips</h1>
    {% if trips %}
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
        {% for trip in trips %}
          <div class="card bg-base-200 w-full shadow-sm border border-primary">
            <figure class="aspect-[4/3]">
              <img src="{{ trip.destination.get_image_url }}" alt="{{ trip.destination }}" />
            </figure>
            <div class="card-body">
              <h2 class="font-bold text-xl">{{ trip.name }}</h2>
              <h3 class="font-bold text-xl">To: {{ trip.destination }}</h3>
              <div class="card-actions justify-end">
                <a href="{% url 'itinerary_builder' trip.id %}" class="btn btn-primary">View Trip</a>
                <form method="post" action="{% url 'delete_trip' trip.id %}" onsubmit="return confirm('Delete this trip? This cannot be undone.');">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-error">Delete</button>
                </form>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="opacity-70">You haven't planned any trips yet.</p>
      <a href="{% url 'organise_trip' %}" class="btn btn-primary mt-4">Start Planning</a>
    {% endif %}
  </div>
{% endblock %}
