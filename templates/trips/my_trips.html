{% extends 'base.html' %}
{% block content  %}
<h1>My trips</h1>
{% for trip in trips %}

<div class="card bg-base-200 w-96 shadow-sm">
  <figure>
   <img src= "{{trip.destination.get_image_url}}" alt ="{{trip.destination}}"/>
  </figure>
  <div class="card-body">
    <h2>{{trip.name}}</h2>
    <h3>{{trip.destination}}</h3>
    <div class="card-actions justify-end">
        
      <a href = "{% url 'trip_detail' trip.id %}" class = "btn btn-primary">View Trip</a>
    </div>
  </div>
</div>
{%  endfor  %}

{% endblock %}
